name: validate-stage-prompts

# Validates every Phase doc's stage prompts against the schemas in
# STAGE-PROMPT-PROTOCOL.md. Runs on every PR that touches Phase docs.
# Catches structural drift before a milestone branches off.

on:
  pull_request:
    paths:
      - 'docs/build-prompts/**'
      - 'sbak/STAGE-PROMPT-PROTOCOL.md'
      - 'validators/validate-stage-prompts.cjs'

# PKG-003 — least-privilege default token (read-only floor).
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false   # CHG-601 — no GITHUB_TOKEN left in .git/config
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
      - name: Validate Phase doc stage prompts
        run: node validators/validate-stage-prompts.cjs --all
