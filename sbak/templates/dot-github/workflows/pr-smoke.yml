name: pr-smoke

# The non-bypassable backstop (verification_locus: hybrid).
# Full Linux + native verification runs LOCALLY at pre-push; this one cheap
# ubuntu job is the tripwire that catches a bypassed or uninstalled local hook
# (e.g. `git push --no-verify`). Linux 1x runner, a few minutes against the free
# quota. It is NOT the primary test run — it is the required status check that
# `--no-verify` cannot skip. Make it a required check in branch protection.

on:
  pull_request:

concurrency:
  group: pr-smoke-${{ github.ref }}
  cancel-in-progress: true

# PKG-003 — least-privilege default token (read-only floor).
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Full history so the App-Map currency check's `git diff <base>` has the
          # PR base commit locally (a shallow clone would not). Baked in
          # unconditionally — matches append-only-ledger.yml's checkout — so it is
          # never a forgotten manual step: harmless when the App-Map step no-ops
          # (no docs/app-map.md), load-bearing the moment a surface ships its entry.
          fetch-depth: 0
          persist-credentials: false   # CHG-601 — no GITHUB_TOKEN left in .git/config
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0  (adjust or remove for non-Node stacks)
        with:
          node-version: '24'
      - name: Smoke check (fast suite)
        # fill {{SMOKE_COMMAND}} with the project's fast suite — e.g. npm ci && npm run lint && npm test
        # PATH-SCOPE it if the suite is Node's built-in runner: `node --test "tests/**/*.test.cjs"`,
        # never a bare `node --test` (it auto-discovers vendored trees like sbak/ — KF-48, M27.D).
        run: |
          {{SMOKE_COMMAND}}

      # App-Map currency check — generated when app_map: on (under app_map: skip
      # the bootstrap omits this step entirely). Runs AFTER the smoke gate above:
      # the binding check asserts every `verified` map entry's test-id exists, and
      # existence is only meaningful against a green suite — ordering is the proof.
      # The tripwire (--surface) also fails a surface-source diff that left
      # docs/app-map.md untouched (escape: a logged app-map-unchanged token via
      # --reason-ok). Globs come from docs/gates.md. Needs git history for the diff
      # base → `fetch-depth: 0` is already set on the checkout step above (baked in
      # unconditionally, like append-only-ledger.yml).
      #
      # The `hashFiles(...)` guard makes the step a structural NO-OP whenever
      # docs/app-map.md is absent — so it never hard-fails (the validator exits 2
      # on a missing map). This covers both app_map: skip (map never generated)
      # AND app_map: on early milestones, before the first surface ships its map
      # entry. The guard is belt-and-suspenders to the bootstrap's omission: even
      # if the step is left in, no map means no failure.
      - name: App-Map currency check
        if: ${{ hashFiles('docs/app-map.md') != '' }}   # skip if no map (app_map: skip, or no surface shipped yet)
        env:
          BASE_REF: ${{ github.base_ref }}   # PKG-005 — bind base_ref via env; never interpolate ${{ }} into the run: shell line
        run: node validators/validate-app-map.cjs --base "origin/$BASE_REF" --tests '{{APP_MAP_TEST_GLOBS}}' --surface '{{APP_MAP_SURFACE_GLOBS}}' docs/app-map.md

      # Sources-registry binding check (operating_mode: research_publish) — the
      # mechanical half of G_RP_R1 (grounded STORM): every inline `[S###]`
      # citation in docs/paper/ must resolve to an id in the sources registry
      # (docs/sources/registry.md). A fabricated citation → exit 1. Defaults cover
      # both --paper (docs/paper) and --registry, so a bare invocation suffices.
      #
      # Guarded by hashFiles('docs/paper/**') so the step is a structural NO-OP for
      # every non-research_publish project (and pre-Phase-R) — the validator exits 2
      # on a missing paper/registry, so the guard prevents an off-path red. Same
      # hashFiles lesson as the App-Map step above (M04).
      - name: Sources-registry binding check (research_publish)
        if: ${{ hashFiles('docs/paper/**') != '' }}   # skip when no paper (non-research_publish, or pre-Phase-R)
        run: node validators/validate-sources.cjs
