name: append-only-ledger

# Enforces the append-only invariant on every ledger listed below, using the
# kit's shared checker `validators/check-append-only.cjs`: a ledger's previously
# committed content must remain a CRLF-normalized byte-prefix of its current
# content (appends only ever go at the end, newest at the bottom). Any edit,
# reorder, or deletion of prior bytes breaks the prefix and fails the job.
#
# Tier behavior (see project-config.md `ledger` toggle):
#   * Full     — make this a REQUIRED status check in branch protection. A
#                prior-line edit then blocks the PR (append_only_enforced).
#   * Standard — keep the workflow but leave it non-required: it reports a
#                violation without blocking (append_only_advisory).
#   * Lite     — no ledgers; delete this workflow.
#
# To add or remove a ledger, edit docs/append-only-ledgers.txt — that is the ONLY place:
# the same file the pre-push hook's append-only leg reads, so the hook and CI never
# disagree about what is a ledger. Do NOT split into per-ledger jobs; the checker takes
# many paths at once.
#
# The check WALKS EVERY COMMIT (M32.B): `--per-commit` compares each commit's ledgers
# against its first parent's, so a rewrite inside the branch is caught even when the
# final file still extends the base. `--head` is the PR head sha because the
# pull_request checkout is a synthetic merge (HEAD^1 = base, HEAD^2 = the PR head) and
# a walk from that HEAD would be one step. Owner-approved rewrites go in an
# `--exceptions` file, printed on every run (see the checker's header).
#
# NOTE on docs/sessions.md (added M27.D, KF-48 instance 2). The generated
# templates/sessions.md has always told every project "CI enforces via diff check",
# and CLAUDE.md §4 rule 4 makes the session register append-only BY HARD RULE
# alongside docs/gap-analysis.md — which was in this list. docs/sessions.md was not.
# The claim shipped with no engine behind it for the life of the kit, found by the
# md2page trial's verifier. Wire-or-de-document was a real fork and the wire won:
# de-documenting would have left a live Hard Rule with nothing enforcing it, and the
# ledger is generated, so the artifact is not hypothetical.
#
# NOTE on project-config.md: its override log is append-only, but the file as a
# whole is intentionally editable (the Tier line and toggle table change on
# re-tier). A whole-file byte-prefix check would false-positive on a legitimate
# re-tier, so project-config.md is deliberately NOT in this list. Its override
# log cites the shared check and stays honor-system / human-reviewed.

on:
  pull_request:

concurrency:
  group: append-only-${{ github.ref }}
  cancel-in-progress: true

# PKG-003 — least-privilege default token (the read-only floor). A job needing
# more elevates in its own `permissions:` block (see release.yml's package job).
permissions:
  contents: read

jobs:
  append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the PR base commit is present locally; the checker
          # runs `git show <base>:<path>` and a shallow clone would not have it.
          fetch-depth: 0
          persist-credentials: false   # CHG-601 — no GITHUB_TOKEN left in .git/config
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      - name: Check ledgers are append-only (every commit)
        # base.sha is the PR base commit and head.sha the PR head — both passed
        # explicitly rather than relying on the local merge-base default or on the
        # synthetic-merge HEAD. The ledger list is the file, read by the hook too.
        run: node validators/check-append-only.cjs --per-commit --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --ledgers docs/append-only-ledgers.txt
